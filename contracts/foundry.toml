[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"   # Monad is EVM-equivalent at the Cancun hardfork (EIP-1153 transient storage used)
optimizer = true
optimizer_runs = 200
via_ir = false
# Deploy.s.sol writes ../deployments/<chainId>.json (read by the keeper and the frontend).
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[fuzz]
runs = 1024

# Solvency-identity invariant tests (test/invariant/): random sequences of trading, price moves,
# auctions, backstop and lane operations against both Paraclr and the naive baseline.
[invariant]
runs = 256
depth = 100
fail_on_revert = true  # the handler try/catches expected reverts; anything else fails

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[lint]
# Remaining int/uint casts are sign-checked or bounded (see _toInt); keep build output clean.
lint_on_build = false
